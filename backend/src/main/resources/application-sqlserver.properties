# Activate with: --spring.profiles.active=sqlserver
# Direct TCP port (SQL Browser is often stopped on SQLEXPRESS)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=biofit;encrypt=true;trustServerCertificate=true
spring.datasource.username=biofit_app
spring.datasource.password=BioFit@2026!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-sqlserver
spring.h2.console.enabled=false
