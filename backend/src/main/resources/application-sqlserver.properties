# Activate with: --spring.profiles.active=sqlserver
# On this machine port 1433 is SQL instance MSSQLSERVER01.
# In SSMS use server name: localhost\MSSQLSERVER01 (Windows Auth)
# App uses Windows Authentication (no biofit_app SQL login needed).
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=biofit;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-sqlserver
# V7–V9 were applied via SSMS for the assignment pack; checksums may differ from
# Flyway's calculator. Keep schema validation via Hibernate ddl-auto=validate.
spring.flyway.validate-on-migrate=false
spring.h2.console.enabled=false
