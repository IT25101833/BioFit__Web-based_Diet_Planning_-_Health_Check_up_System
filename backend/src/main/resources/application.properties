spring.application.name=biofit-backend
server.port=${SERVER_PORT:8080}

# Default local profile: H2 (no SQL Server required)
spring.datasource.url=jdbc:h2:file:./data/biofit;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

biofit.jwt.secret=${BIOFIT_JWT_SECRET:dev-only-change-me-biofit-jwt-secret-key-32c}
biofit.jwt.access-token-minutes=${BIOFIT_JWT_ACCESS_MINUTES:30}
biofit.jwt.refresh-token-days=${BIOFIT_JWT_REFRESH_DAYS:7}
biofit.cors.origins=${BIOFIT_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
biofit.seed-demo-data=false
# Creates medical@biofit.local + client@biofit.local (password Demo123!) if missing
biofit.bootstrap-accounts=true

logging.level.org.springframework.security=INFO
