spring.application.name=biofit-backend
server.port=${SERVER_PORT:8080}

# Optional local secrets. Works from /backend or project root as the process working directory.
spring.config.import=\
optional:file:./.env[.properties],\
optional:file:./backend/.env[.properties],\
optional:file:./application-local.properties,\
optional:file:./backend/application-local.properties

# Default local profile: H2 file DB (no AUTO_SERVER — OneDrive/VPN IPs break TCP auto-server locks)
spring.datasource.url=jdbc:h2:file:./data/biofit;DB_CLOSE_DELAY=-1;FILE_LOCK=FILE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

biofit.jwt.secret=${BIOFIT_JWT_SECRET:dev-only-change-me-biofit-jwt-secret-key-32c}
biofit.jwt.access-token-minutes=${BIOFIT_JWT_ACCESS_MINUTES:30}
biofit.jwt.refresh-token-days=${BIOFIT_JWT_REFRESH_DAYS:7}
biofit.cors.origins=${BIOFIT_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
biofit.seed-demo-data=true
# Creates medical@biofit.local + client@biofit.local (password Demo123!) if missing
biofit.bootstrap-accounts=true

# Email (OTP verification) — map SPRING_MAIL_* from .env
biofit.mail.enabled=${BIOFIT_MAIL_ENABLED:false}
# Local-only: when SMTP fails, return OTP in API / console. MUST be false in production.
biofit.mail.dev-fallback=${BIOFIT_MAIL_DEV_FALLBACK:false}
biofit.mail.from=${BIOFIT_MAIL_FROM:${SPRING_MAIL_USERNAME:noreply@biofit.local}}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
# Port 465: SSL on, STARTTLS off. Port 587: STARTTLS on, SSL off (set via .env).
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=${SPRING_MAIL_SMTP_SSL_CHECK_IDENTITY:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:15000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_READ_TIMEOUT:15000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:15000}

# Receipt uploads for cash wallet top-ups. There was no previous upload limit.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
biofit.wallet.receipt-max-bytes=5242880
biofit.wallet.receipt-dir=./data/wallet-receipts

logging.level.org.springframework.security=INFO
logging.level.com.biofit.backend.mail=INFO
